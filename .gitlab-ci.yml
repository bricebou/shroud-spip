# Intégration continue sur git.spip.net, dans l'image d'outillage de SPIP (Alpine, PHP, Composer).
# Le style et l'analyse statique d'abord, en parallèle ; les tests ensuite, sur chaque version de PHP
# prise en charge. PHPStan et PHPUnit laissent leurs rapports à la merge request.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

stages:
  - check
  - test

variables:
  PHP_VERSION: "8.4"

default:
  image:
    name: spip/tools:${PHP_VERSION}
    entrypoint: [""]
  interruptible: true
  cache:
    key: composer-${PHP_VERSION}
    paths:
      - vendor/
  before_script:
    - composer install --no-progress
    - mkdir -p build

style:
  stage: check
  script:
    - composer check:syntax
    - composer check:cs
    - composer check:rector

phpstan:
  stage: check
  script:
    - composer ci:static
  artifacts:
    when: always
    reports:
      codequality: build/phpstan.json

phpunit:
  stage: test
  parallel:
    matrix:
      - PHP_VERSION: ["8.4", "8.5"]
  script:
    - composer ci:test
  artifacts:
    when: always
    reports:
      junit: build/junit.xml
